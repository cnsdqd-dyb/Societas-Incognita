   <g id="text_1">
    <text style="fill: #23334a; font: 700 23px 'Microsoft YaHei'; text-anchor: start" x="25.56" y="35.4672" transform="rotate(-0 25.56 35.4672)">世界规律如何连接起来</text>
   </g>
   <g id="text_2">
    <text style="fill: #60718b; font: 11px 'Microsoft YaHei'; text-anchor: start" x="25.56" y="58.1976" transform="rotate(-0 25.56 58.1976)">candidate_19  ·  属性条件 → 反应 → 状态反馈</text>
   </g>
   <g id="text_3">
    <text style="fill: #36a88b; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="40.626" y="120.2904" transform="rotate(-0 40.626 120.2904)">可观察的物质与设备</text>
   </g>
   <g id="text_4">
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(40.626 150.065625)">材料：光谱响应、偏转、孔隙</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(40.626 165.647081)">设备：模式通道、校准样片</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(40.626 181.228538)">初始线索 + 持有后的私有记录</text>
   </g>
   <g id="text_5">
    <text style="fill: #8b72d2; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="302.886" y="120.2904" transform="rotate(-0 302.886 120.2904)">隐藏的逻辑条件</text>
   </g>
   <g id="text_6">
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(302.886 150.065625)">材料条件 ∧ 设备条件 ∧ 状态条件</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(302.886 165.647081)">条件内部可以包含 ∨ 与 ¬</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(302.886 181.228538)">满足条件才进入反应结算</text>
   </g>
   <g id="text_7">
    <text style="fill: #e9a548; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="570.726" y="120.2904" transform="rotate(-0 570.726 120.2904)">实际加工与产出</text>
   </g>
   <g id="text_8">
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(570.726 150.065625)">限制性原料决定反应量</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(570.726 165.647081)">产率受数学状态与能量预算约束</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(570.726 181.228538)">产物、副产物、消耗、余料返还</text>
   </g>
   <g id="text_9">
    <text style="fill: #49a596; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="40.626" y="303.2424" transform="rotate(-0 40.626 303.2424)">资源池与能量账本</text>
   </g>
   <g id="text_10">
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(40.626 333.017625)">再生、耗竭、物质流动、储能</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(40.626 348.599081)">物理变化反映到下一轮观测</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(40.626 364.180538)">总能量变化 = 外部输入 − 耗散</text>
   </g>
   <g id="text_11">
    <text style="fill: #4382c5; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="302.886" y="303.2424" transform="rotate(-0 302.886 303.2424)">数学状态随操作演化</text>
   </g>
   <g id="text_12">
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(302.886 333.017625)">本世界有 9 个动态变量</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(302.886 348.599081)">stress、delay_0、delay_1…</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(302.886 364.249069)">加工与采集累计量进入状态方程</text>
   </g>
   <g id="text_13">
    <text style="fill: #e9a548; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="570.726" y="303.2424" transform="rotate(-0 570.726 303.2424)">本世界的实际生产链</text>
   </g>
   <g id="text_14">
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(570.726 333.017625)">A + B → C + W</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(570.726 348.599081)">C + W → D</text>
    <text style="fill: #23334a; font: 10.2px 'Microsoft YaHei'" transform="translate(570.726 364.180538)">D + B → S</text>
   </g>
   <g id="text_15">
    <text style="fill: #4382c5; font: 9px 'Microsoft YaHei'; text-anchor: start" x="426.204" y="258.336" transform="rotate(-0 426.204 258.336)">影响下一轮条件</text>
   </g>
   <g id="text_16">
    <text style="fill: #23334a; font: 700 12px 'Microsoft YaHei'; text-anchor: start" x="31.14" y="444.6144" transform="rotate(-0 31.14 444.6144)">44 条配置表达式    /    89 个依赖节点    /    117 条依赖边</text>
   </g>
   <g id="text_17">
    <text style="fill: #77869b; font: 9px 'Microsoft YaHei'; text-anchor: start" x="31.14" y="467.8992" transform="rotate(-0 31.14 467.8992)">依据实际世界配置生成 · 示意图压缩了结算阶段 · 依赖关系不等于已证明的因果效应</text>
   </g>
  </g>

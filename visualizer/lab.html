<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>机制实验室 · Material Worlds</title><link rel="stylesheet" href="/portal.css"></head><body class="portal"><nav><strong>▦ MATERIAL WORLDS</strong><div class="nav-links"><a href="/lab">机制实验室</a><a href="/replay">智能体回放</a><a href="/works">作品档案</a></div></nav><main><div class="eyebrow">OFFLINE / ENGINE-DRIVEN</div><h1>机制实验室</h1><p class="intro">同一个种子对应同一组规则与布局。组合机制，观察材料池、反馈变量、生产与耗散如何演化。</p><div class="lab-grid"><form class="controls" id="parameters"><b>世界设定</b><label>从已保存的世界读取<select id="preset"><option value="">自定义机制组合</option></select></label><div class="mechanisms" id="mechanisms"></div><label>世界种子<input name="seed" type="number" value="7" min="0" max="2147483647"></label><label>初始池存量 / 容量 <input name="stock" type="range" min="0.05" max="1" step="0.05" value="0.5"><output id="stockValue">50%</output></label><label>每次采集量<input name="amount" type="number" value="3" min="1" max="8"></label><label>演化回合<input name="rounds" type="number" value="60" min="1" max="120"></label><label>操作探针<select name="drive"><option value="production">采集 → 尝试配方 → 使用材料</option><option value="idle">无操作 / 自主演化</option></select></label><button class="primary" type="submit">生成世界与演化</button><p class="notice">固定探针，每成员每回合一次操作；不包含生存消耗、不调用模型、不写入实验。可在事件记录中核对未成功的操作。</p><p class="status" id="status" role="status"></p></form><section class="lab-stage"><div class="canvas-wrap"><canvas id="materialScene" width="960" height="480" aria-label="材料世界像素动画"></canvas></div><div class="transport"><button id="playLab">Ⅱ 暂停</button><select id="labSpeed"><option>1</option><option>4</option><option selected>16</option><option>32</option></select><span>×</span><input id="labTime" type="range" min="0" max="60" value="0"><b id="labRound">R0</b></div><div class="metrics" id="ledger"></div><h2>物质存量与控制变量</h2><canvas id="historyPlot" width="960" height="200" aria-label="物质存量时间曲线"></canvas><div id="plotLegend" class="notice"></div><div class="variables" id="fields"></div><details open><summary>当前回合 · 实际操作 / 物质流</summary><pre id="labEvents"></pre></details><details><summary>世界规则 · 可核对的表达式与配方</summary><pre id="equations"></pre></details><button id="downloadProbe">导出演示 JSON</button></section></div></main><script src="/lab.js"></script></body></html>

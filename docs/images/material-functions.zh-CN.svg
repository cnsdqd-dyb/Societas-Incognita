<text x="889" y="315" font-size="18" fill="#293f37" font-weight="bold">破坏与冲突</text>
<text x="889" y="345" font-size="15" fill="#293f37" font-weight="normal">成员攻击与大范围毁伤</text>
<text x="889" y="370" font-size="15" fill="#293f37" font-weight="normal">资源污染与加工台破坏</text>
<text x="889" y="395" font-size="15" fill="#293f37" font-weight="normal">设备与储存容器损伤</text>
<text x="28" y="454" font-size="14" fill="#728075" font-weight="normal">已实现 24 类附加功能，每个世界按种子选取一部分；材料成本与目标权限仍然有效。</text>
<text x="28" y="477" font-size="12" fill="#728075" font-weight="normal">概念接口图：新增功能已做运行时验证，其完整语义尚未获得 Lean 认证。</text>

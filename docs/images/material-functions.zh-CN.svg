<text x="467" y="345" font-size="15" fill="#293f37" font-weight="normal">提高产率、诊断与切换速度</text>
<text x="467" y="370" font-size="15" fill="#293f37" font-weight="normal">储存保护、放能与防护</text>
<text x="467" y="395" font-size="15" fill="#293f37" font-weight="normal">付费救援，下一轮恢复行动</text>

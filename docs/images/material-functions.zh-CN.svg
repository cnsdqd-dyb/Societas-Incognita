<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 490" role="img" aria-labelledby="title desc">
<title id="title">材料组合解锁可使用的功能与破坏作用</title>
<desc id="desc">生产材料，同一成员库存凑齐条件后私下发现功能，再确认付费使用或取消。作用改变作品、能力、生存条件或公共资源。这是概念图，不是实验轨迹。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#83927b"/></marker></defs>
